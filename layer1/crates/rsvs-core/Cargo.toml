[package]
name = "rsvs"
version = "12.0.0"
edition = "2021"
description = "Aphantasic Abstraction Model — v12.0 unified DAG pipeline with 6 abstractions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wolfvin/AphantasicAbstractionModel"
keywords = ["symbolic", "knowledge-graph", "compositional", "cognitive", "nlp"]
categories = ["science", "data-structures", "algorithms"]
readme = "README.md"

[lib]
name = "rsvs"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = ["v12"]
python = ["pyo3", "pyo3/extension-module"]
v12 = []

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"

[dev-dependencies]
tempfile = "3"
