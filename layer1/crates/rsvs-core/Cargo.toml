[package]
name = "rsvs"
version = "8.3.0"
edition = "2021"
description = "Recursive Symbolic Vocabulary System — compositional symbolic engine with structural meaning"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wolfvin/SymbolicPuzzle3D"
keywords = ["symbolic", "knowledge-graph", "compositional", "cognitive", "nlp"]
categories = ["science", "data-structures", "algorithms"]
readme = "README.md"

[lib]
name = "rsvs"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "rsvs-smoke"
path = "src/bin/rsvs-smoke.rs"

[[bin]]
name = "rsvs-tui"
path = "src/bin/rsvs-tui.rs"

[[bin]]
name = "rsvs-realtest"
path = "src/bin/rsvs-realtest.rs"

[features]
default = []
python = ["pyo3", "pyo3/extension-module"]
v12 = []

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"
twox-hash = "2"
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "rsvs_bench"
harness = false
