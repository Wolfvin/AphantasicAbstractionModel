[package]
name = "rsvs-integration-tests"
version = "8.3.0"
edition = "2021"
description = "Integration tests for the RSVS pipeline"

[dependencies]
rsvs = { path = "../../crates/rsvs-core" }
serde_json = "1"

[features]
v12 = ["rsvs/v12"]

[[test]]
name = "integration"
path = "main.rs"

[[test]]
name = "v12_validation"
path = "v12_validation.rs"
required-features = ["v12"]
