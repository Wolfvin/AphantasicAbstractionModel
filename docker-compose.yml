# ──────────────────────────────────────────────────────────────────────
#  SymbolicPuzzle3D — Docker Compose
#  Nginx (reverse proxy) + Backend (Rust + Python bridge) + Frontend (Next.js)
#  v7.2: Added HTTPS/Certbot support, server-side API key, atomic persist
# ──────────────────────────────────────────────────────────────────────

services:
  # ── Nginx reverse proxy ─────────────────────────────────────────────
  # Centralizes TLS termination, rate limiting, and access control.
  # Only Nginx exposes ports to the host; backend/frontend are internal.
  nginx:
    image: nginx:alpine
    container_name: sp3d-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ── Backend: Rust core + Python bridge ──────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: rust-builder
    image: symbolic-puzzle-3d/backend:latest
    container_name: sp3d-backend
    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir /dist/wheels/*.whl || maturin develop --manifest-path crates/rsvs-core/Cargo.toml
        cd /build && PYTHONPATH=python python3 -m rsvs.fastapi_server
    # No direct port exposure — accessible only via nginx
    expose:
      - "8000"
    volumes:
      - rsvs-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
      - RSVS_ATOM_DIR=/app/data
      - RSVS_BRIDGE_HOST=0.0.0.0
      - RSVS_BRIDGE_PORT=8000
      # Security: Set these in production via .env or docker-compose.override.yml
      - RSVS_API_KEY=${RSVS_API_KEY:-}
      - RSVS_ALLOWED_ORIGINS=http://frontend:3000,http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # ── Frontend: Next.js production server ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    image: symbolic-puzzle-3d/frontend:latest
    container_name: sp3d-frontend
    command: ["node", "server.js"]
    # No direct port exposure — accessible only via nginx
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      # Server-side only — never exposed to browser (no NEXT_PUBLIC_ prefix)
      - RSVS_BACKEND_URL=http://backend:8000
      - RSVS_API_KEY=${RSVS_API_KEY:-}
      - HOSTNAME=0.0.0.0
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # ── Certbot (Let's Encrypt certificate renewal) ────────────────────────
  # Run once to obtain certificates:
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d your-domain.com
  # Then uncomment the HTTPS server block in nginx.conf
  certbot:
    image: certbot/certbot
    container_name: sp3d-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"
    profiles:
      - production

volumes:
  rsvs-data:
    driver: local
  certbot-www:
    driver: local
  certbot-conf:
    driver: local
