# ──────────────────────────────────────────────────────────────────────
#  RSVS — Continuous Integration
#  Lint → Test → Build pipeline for Rust core, Python package, Frontend
# ──────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

jobs:
  # ══════════════════════════════════════════════════════════════════════
  #  LINT STAGE
  # ══════════════════════════════════════════════════════════════════════

  # ── Rust lint ────────────────────────────────────────────────────────
  rust-lint:
    name: Rust lint – fmt & clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layer1

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo registry & index
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('layer1/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache Cargo build artifacts
        uses: actions/cache@v5
        with:
          path: layer1/target
          key: cargo-target-lint-${{ runner.os }}-${{ hashFiles('layer1/Cargo.lock') }}
          restore-keys: |
            cargo-target-lint-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  # ── Python lint ──────────────────────────────────────────────────────
  python-lint:
    name: Python ${{ matrix.python-version }} lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: |
            pip-lint-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install lint dependencies
        working-directory: python
        run: |
          pip install --upgrade pip
          pip install "ruff>=0.4"

      - name: Check formatting
        working-directory: python
        run: ruff format --check .

      - name: Run ruff lint
        working-directory: python
        run: ruff check .

  # ── Frontend lint ────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend lint – Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

  # ══════════════════════════════════════════════════════════════════════
  #  TEST STAGE (depends on lint)
  # ══════════════════════════════════════════════════════════════════════

  # ── Rust test ────────────────────────────────────────────────────────
  rust-test:
    name: Rust test – ${{ matrix.os }}
    needs: [rust-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    defaults:
      run:
        working-directory: layer1

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry & index
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('layer1/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache Cargo build artifacts
        uses: actions/cache@v5
        with:
          path: layer1/target
          key: cargo-target-test-${{ runner.os }}-${{ hashFiles('layer1/Cargo.lock') }}
          restore-keys: |
            cargo-target-test-${{ runner.os }}-

      - name: Run tests
        run: cargo test --lib

  # ── Python test (needs Rust extension built via maturin) ─────────────
  python-test:
    name: Python ${{ matrix.python-version }} test – ${{ matrix.os }}
    needs: [python-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Cargo registry & index
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('layer1/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache Cargo build artifacts
        uses: actions/cache@v5
        with:
          path: layer1/target
          key: cargo-target-pytest-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('layer1/Cargo.lock') }}
          restore-keys: |
            cargo-target-pytest-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-test-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: |
            pip-test-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install Python dev dependencies
        working-directory: python
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Build and install Rust extension via maturin
        working-directory: python
        run: maturin develop --release

      - name: Run tests
        working-directory: python
        run: pytest tests/ -v

  # ── Frontend build ───────────────────────────────────────────────────
  frontend-build:
    name: Frontend build – Node ${{ matrix.node-version }}
    needs: [frontend-lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # ══════════════════════════════════════════════════════════════════════
  #  GATE — all checks must pass
  # ══════════════════════════════════════════════════════════════════════
  ci-passed:
    name: CI Passed
    if: always()
    runs-on: ubuntu-latest
    needs: [rust-test, python-test, frontend-build]
    steps:
      - name: Check all jobs
        run: |
          echo "rust-lint:       ${{ needs.rust-test.result }}"
          echo "python-test:     ${{ needs.python-test.result }}"
          echo "frontend-build:  ${{ needs.frontend-build.result }}"
          if [[ "${{ needs.rust-test.result }}" == "success" && \
                "${{ needs.python-test.result }}" == "success" && \
                "${{ needs.frontend-build.result }}" == "success" ]]; then
            echo "All CI checks passed!"
            exit 0
          else
            echo "One or more CI checks failed."
            exit 1
          fi
