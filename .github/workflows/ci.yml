# ──────────────────────────────────────────────────────────────────────
#  RSVS — Continuous Integration
#  Tests Rust core, builds Python wheel via maturin, and validates Python
# ──────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

jobs:
  # ── Rust checks ─────────────────────────────────────────────────────
  rust:
    name: Rust – test & clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: backend/target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Run tests
        working-directory: backend
        run: cargo test --workspace

      - name: Run clippy
        working-directory: backend
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --all -- --check

  # ── Python checks ──────────────────────────────────────────────────
  python:
    name: Python ${{ matrix.python-version }} – wheel + test + lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: backend/target
          key: cargo-target-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install Python dev dependencies
        working-directory: python
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Build and install wheel with maturin
        working-directory: python
        run: maturin develop --release

      - name: Run tests
        working-directory: python
        run: pytest

      - name: Run ruff lint
        working-directory: python
        run: ruff check .

      - name: Run mypy
        working-directory: python
        run: mypy rsvs/
