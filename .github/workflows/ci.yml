name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  # ────────────────────────────── Rust ──────────────────────────────
  rust:
    name: Rust – fmt · clippy · test · coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python 3.12 (for maturin / PyO3)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Cargo artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate coverage report
        run: cargo tarpaulin --workspace --out Xml --skip-clean

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: backend/cobertura.xml
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ────────────────────────────── Python ──────────────────────────────
  python:
    name: Python – ruff · pytest · coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Cargo artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Python dev dependencies
        run: |
          pip install --upgrade pip
          pip install maturin ruff pytest pytest-cov pytest-asyncio httpx mypy

      - name: Build Rust extension (maturin develop)
        run: |
          pip install maturin
          maturin develop --manifest-path crates/rsvs-core/Cargo.toml

      - name: Ruff lint
        run: ruff check python/

      - name: Run pytest with coverage
        run: PYTHONPATH=python python -m pytest python/tests -v --tb=short --cov=rsvs --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: backend/coverage.xml
          flags: python
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ────────────────────────────── Frontend ──────────────────────────────
  frontend:
    name: Frontend – lint · build · test · coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests (Vitest)
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          directory: frontend/coverage
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ────────────────────────────── Benchmarks ──────────────────────────────
  benchmark:
    name: Rust – benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: cargo-bench-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-bench-${{ runner.os }}-

      - name: Run benchmarks
        run: cargo bench --workspace -- --save-baseline ci-baseline

      - name: Store benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: criterion-benchmarks
          path: backend/target/criterion/
          retention-days: 30

  # ────────────────────────────── Gate ──────────────────────────────
  ci-passed:
    name: CI Passed
    if: always()
    runs-on: ubuntu-latest
    needs: [rust, python, frontend, benchmark]
    steps:
      - name: Check all jobs succeeded
        run: |
          echo "rust:       ${{ needs.rust.result }}"
          echo "python:     ${{ needs.python.result }}"
          echo "frontend:   ${{ needs.frontend.result }}"
          echo "benchmark:  ${{ needs.benchmark.result }}"
          if [[ "${{ needs.rust.result }}" == "success" && \
                "${{ needs.python.result }}" == "success" && \
                "${{ needs.frontend.result }}" == "success" && \
                ("${{ needs.benchmark.result }}" == "success" || "${{ needs.benchmark.result }}" == "cancelled") ]]; then
            echo "All CI jobs passed!"
            exit 0
          else
            echo "One or more CI jobs failed."
            exit 1
          fi
