name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  # ────────────────────── Build Rust crate ──────────────────────
  build-rust:
    name: Build Rust – ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: cargo-release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-${{ matrix.target }}-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Rust artefact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p /tmp/rust-artefacts
          cp target/${{ matrix.target }}/release/librsvs.{a,so} /tmp/rust-artefacts/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/librsvs.* /tmp/rust-artefacts/ 2>/dev/null || true

      - name: Upload Rust artefact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\rust-artefacts
          Copy-Item "target\${{ matrix.target }}\release\rsvs.dll" C:\rust-artefacts\ -ErrorAction SilentlyContinue
          Copy-Item "target\${{ matrix.target }}\release\rsvs.dll.lib" C:\rust-artefacts\ -ErrorAction SilentlyContinue

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: rsvs-${{ matrix.target }}
          path: |
            /tmp/rust-artefacts/*
            C:\rust-artefacts\*
          if-no-files-found: warn

  # ────────────────────── Build Python wheel ──────────────────────
  build-python:
    name: Build Python wheel – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: maturin build --release --strip --out /tmp/wheels

      - name: Upload wheel artefact
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.os }}
          path: /tmp/wheels/*.whl
          if-no-files-found: error

  # ────────────────────── Publish to crates.io ──────────────────────
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [build-rust]
    defaults:
      run:
        working-directory: backend/crates/rsvs-core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Dry-run publish
        run: cargo publish --dry-run
        continue-on-error: true

      - name: Publish to crates.io
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ────────────────────── Publish to PyPI ──────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-python]
    permissions:
      id-token: write

    steps:
      - name: Download wheel artefacts
        uses: actions/download-artifact@v8
        with:
          pattern: python-wheel-*
          path: /tmp/all-wheels
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install twine
        run: pip install twine

      - name: Check wheels
        run: twine check /tmp/all-wheels/*.whl

      - name: Publish to PyPI (Trusted Publisher)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: /tmp/all-wheels

  # ────────────────────── GitHub Release ──────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-rust, build-python]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artefacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/release-artefacts
          merge-multiple: false

      - name: Create release archive
        run: |
          mkdir -p /tmp/release-bundle
          cp -r /tmp/release-artefacts/* /tmp/release-bundle/ || true

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## What's Changed

            See [CHANGELOG.md](./CHANGELOG.md) for full details.

            ### Downloads
            - **Rust crate**: `cargo install rsvs@${{ steps.version.outputs.VERSION }}`
            - **Python wheel**: `pip install rsvs==${{ steps.version.outputs.VERSION }}`
            - **Pre-built binaries**: See assets below

          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: |
            /tmp/release-artefacts/python-wheel-*/*.whl
            /tmp/release-artefacts/rsvs-*/*
