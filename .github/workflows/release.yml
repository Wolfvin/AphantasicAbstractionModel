# ──────────────────────────────────────────────────────────────────────
#  RSVS — Release
#  Builds wheels (manylinux / macOS / Windows), sdist, publishes to
#  PyPI via Trusted Publisher (OIDC), pushes Docker image to ghcr.io,
#  and creates a GitHub Release with changelog excerpt.
# ──────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # create GitHub Release
  id-token: write        # PyPI Trusted Publisher (OIDC)
  packages: write        # ghcr.io push

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

jobs:
  # ── Build wheels with maturin-action ────────────────────────────────
  build-wheels:
    name: Build wheel – ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          # Linux aarch64 (cross-compile)
          - runner: ubuntu-latest
            target: aarch64
            manylinux: auto
          # macOS x86_64
          - runner: macos-latest
            target: x86_64
            manylinux: ""
          # macOS arm64 (Apple Silicon)
          - runner: macos-latest
            target: aarch64
            manylinux: ""
          # Windows x86_64
          - runner: windows-latest
            target: x86_64
            manylinux: ""

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out ../dist
          rust-toolchain: stable
          # maturin-action reads python/pyproject.toml automatically

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist
          retention-days: 5

  # ── Source distribution ─────────────────────────────────────────────
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out ../dist
          rust-toolchain: stable

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist
          retention-days: 5

  # ── Publish to PyPI via Trusted Publisher ───────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # OIDC for Trusted Publisher

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: dist/* --skip-existing

  # ── Docker image → ghcr.io ──────────────────────────────────────────
  docker:
    name: Docker → ghcr.io
    needs: [build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # ── GitHub Release ──────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need full history for changelog extraction

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          # Works with Keep-a-Changelog format: ## [X.Y.Z] - YYYY-MM-DD
          CHANGELOG=$(awk "
            /^## \\[${VERSION}\\]/ { found=1; next }
            found && /^## \\[/ { exit }
            found { print }
          " CHANGELOG.md)
          # Fallback if nothing matched
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          # Write to file for multiline GHA output
          echo "$CHANGELOG" > _release_body.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RSVS v${{ steps.changelog.outputs.version }}
          body_path: _release_body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            dist/*
