name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────── Rust Audit ──────────────────────────────
  cargo-audit:
    name: Rust – cargo audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  # ────────────────────────────── Python Audit ──────────────────────────────
  pip-audit:
    name: Python – pip audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip audit
        run: |
          pip install .
          pip-audit --desc
        continue-on-error: true

  # ────────────────────────────── Container Scan ──────────────────────────────
  trivy-scan:
    name: Container – Trivy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t symbolic-puzzle-3d:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "symbolic-puzzle-3d:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ────────────────────────────── Gate ──────────────────────────────
  security-passed:
    name: Security Scan Passed
    if: always()
    runs-on: ubuntu-latest
    needs: [cargo-audit, pip-audit, trivy-scan]
    steps:
      - name: Check all security jobs
        run: |
          echo "cargo-audit: ${{ needs.cargo-audit.result }}"
          echo "pip-audit:   ${{ needs.pip-audit.result }}"
          echo "trivy-scan:  ${{ needs.trivy-scan.result }}"
          if [[ "${{ needs.cargo-audit.result }}" == "success" && \
                "${{ needs.trivy-scan.result }}" == "success" ]]; then
            echo "Critical security scans passed!"
            exit 0
          else
            echo "One or more security scans failed."
            exit 1
          fi
