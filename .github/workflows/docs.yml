# ──────────────────────────────────────────────────────────────────────
#  RSVS — Documentation (GitHub Pages)
#  Builds MkDocs site and deploys to gh-pages branch.
#  Also validates docs build on pull requests.
#
#  After first run, go to:
#    Settings → Pages → Source → Deploy from branch → gh-pages / root
# ──────────────────────────────────────────────────────────────────────

name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── Build & Deploy ─────────────────────────────────────────────────
  deploy:
    name: Build & deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Needed for git-revision-date plugin

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install MkDocs and plugins
        run: |
          pip install --upgrade pip
          pip install \
            mkdocs-material>=9.5 \
            mkdocs-git-revision-date-localized-plugin>=1.2 \
            mkdocs-minify-plugin>=0.7 \
            mkdocs-autorefs>=1.0 \
            pymdown-extensions>=10.0

      - name: Copy root docs into docs/ (MkDocs source)
        run: |
          cp ARCHITECTURE.md docs/architecture.md

      - name: Build MkDocs site
        run: mkdocs build

      - name: Deploy to gh-pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "docs: deploy ${{ github.sha }}"
