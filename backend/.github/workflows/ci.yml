name: rsvs-ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust check
        run: PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 cargo check -p rsvs
      - name: Rust test
        run: PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 cargo test -p rsvs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install --upgrade pip maturin pytest
      - name: Build extension
        run: PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 maturin develop --manifest-path crates/rsvs-core/Cargo.toml
      - name: Python test
        run: PYTHONPATH=python python -m pytest python/tests -v
      - name: Wheel smoke
        run: PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 maturin build --manifest-path crates/rsvs-core/Cargo.toml --release
