[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rsvs"
version = "0.5.0"
description = "Recursive Symbolic Vector Space — Python bindings"
requires-python = ">=3.9"

[tool.maturin]
manifest-path = "crates/rsvs-core/Cargo.toml"
python-source = "python"
features = ["pyo3/extension-module"]
module-name = "rsvs._rsvs"

[project.scripts]
rsvs = "rsvs.cli:main"
