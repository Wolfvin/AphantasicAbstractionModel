[package]
name = "rsvs"
version = "4.2.0"
edition = "2021"

[lib]
name = "rsvs"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "rsvs-smoke"
path = "src/bin/rsvs-smoke.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
